name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@7987652d6484da52313ca543160d84b0540e10bd # v4.1.4
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
